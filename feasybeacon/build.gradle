apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'androidx.navigation.safeargs.kotlin'
apply plugin: 'kotlin-kapt'

android {
    namespace 'com.feasycom.feasybeacon'
    compileSdk 35

    defaultConfig {
        applicationId "com.feasycom.feasybeacon"
        minSdk 29
        targetSdk 35
        versionCode 33915
        versionName "3.3.9.15"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            zipAlignEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        debug {
            minifyEnabled false
            zipAlignEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packagingOptions {
        jniLibs {
            keepDebugSymbols += ['**/*.so']
        }
        resources {
            excludes += ['META-INF/ota_release.kotlin_module', 'META-INF/common_release.kotlin_module']
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }

    buildFeatures {
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            if (buildType.name == 'release') {
                def createTime = new Date().format("YYYY-MM-dd", TimeZone.getTimeZone("GMT+08:00"))
                outputFileName = "FeasyBeacon${defaultConfig.versionName}_${createTime}.apk"
            }
        }
    }
}

kotlin {
    jvmToolchain(17)
}

kapt {
    javacOptions {
        option("-source", "17")
        option("-target", "17")
        option("--release", "17")
    }
}

dependencies {

    // FeasyBeaconLibrary 以 AAR 形式引入（SDK 源码不在本仓库）
    implementation fileTree(dir: "libs", include: ["*.jar", "*.aar"])

    // AndroidX 核心依赖项 - 保持原有版本
    implementation 'androidx.core:core-ktx:1.8.0'
    implementation 'androidx.appcompat:appcompat:1.3.0'
    implementation 'com.google.android.material:material:1.3.0'
    //implementation 'androidx.constraintlayout:constraintlayout:2.0.4'  // 保持注释状态

    // Room 数据库
    implementation "androidx.room:room-runtime:2.6.1"
    implementation "androidx.room:room-ktx:2.6.1"
    kapt "androidx.room:room-compiler:2.6.1"

    // Navigation 组件 - 保持原有版本
    implementation "androidx.navigation:navigation-fragment-ktx:2.5.3"
    implementation "androidx.navigation:navigation-ui-ktx:2.5.3"
    implementation ("androidx.navigation:navigation-dynamic-features-fragment:2.5.3") {
        exclude group: 'com.google.android.play', module: 'core'
    }
    androidTestImplementation "androidx.navigation:navigation-testing:2.5.3"
    implementation 'com.github.JessYanCoding:AndroidAutoSize:v1.2.1'
    // 图片加载
    implementation "com.github.bumptech.glide:glide:4.15.1"
    //kapt "com.github.bumptech.glide:compiler:4.15.1"  // 如果不需要可以注释

    // PDF查看器
    //implementation 'com.github.barteksc:android-pdf-viewer:3.2.0-beta.1'

    // 异常处理
    implementation 'cat.ereza:customactivityoncrash:2.2.0'

    // 动态权限管理
    implementation 'com.github.getActivity:XXPermissions:28.0'
    implementation 'com.github.getActivity:DeviceCompat:2.3'

    // Retrofit 网络请求
    implementation "com.squareup.retrofit2:retrofit:2.9.0"
    implementation "com.squareup.retrofit2:converter-gson:2.9.0"

    // Lifecycle 组件 - 保持原有版本
    implementation "androidx.lifecycle:lifecycle-extensions:2.2.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.2"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:2.6.2"


    // 添加 RecyclerView 依赖
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // 下拉刷新
   // implementation 'com.scwang.smartrefresh:SmartRefreshLayout:1.1.0'

    implementation  'io.github.scwang90:refresh-layout-kernel:3.0.0-alpha'      //核心必须依赖
    implementation  'io.github.scwang90:refresh-header-classics:3.0.0-alpha'    //经典刷新头


    // 测试依赖项
    testImplementation 'junit:junit:4.+'
    androidTestImplementation 'androidx.test.ext:junit:1.1.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.3.0'

    // 应用更新
    implementation 'com.google.android.play:app-update:2.1.0'

    // CameraX - 保持原有版本

/*    def camerax_version = "1.4.0"
    implementation "androidx.camera:camera-core:$camerax_version"
    implementation "androidx.camera:camera-camera2:$camerax_version"
    implementation "androidx.camera:camera-video:$camerax_version"
    implementation "androidx.camera:camera-lifecycle:$camerax_version"
    implementation "androidx.camera:camera-view:$camerax_version"*/

    // Zxing
    //implementation 'com.google.zxing:core:3.5.3'

    implementation 'com.mylhyl:zxingscanner:2.2.0'

    // 自定义键盘
    implementation 'com.king.keyboard:kingkeyboard:1.0.0'

    // Excel 处理
    implementation 'net.sourceforge.jexcelapi:jxl:2.6.12'

    // 工具库
    implementation 'com.blankj:utilcodex:1.31.1'

    // OkHttp 拦截器
    implementation 'com.squareup.okhttp3:logging-interceptor:4.9.1'

    // 保持您原有的依赖版本，不添加额外依赖
}
